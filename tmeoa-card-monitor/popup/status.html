<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>abt状态检查</title>
  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #eef5ff 0%, #f7fbf8 52%, #ffffff 100%);
      color: #182230;
    }
    .status-card {
      width: 390px;
      border: 1px solid rgba(24, 34, 48, 0.1);
      border-radius: 18px;
      box-shadow: 0 20px 60px rgba(24, 34, 48, 0.18);
      overflow: hidden;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(18px);
    }
    .top {
      padding: 18px 20px;
      color: white;
      background: linear-gradient(135deg, #2fb344 0%, #57c785 100%);
    }
    .eyebrow {
      margin: 0 0 5px;
      font-size: 12px;
      font-weight: 700;
      opacity: 0.82;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-size: 20px;
      line-height: 1.25;
      letter-spacing: 0;
    }
    .content {
      padding: 18px 20px 16px;
    }
    .content p {
      margin: 0 0 6px;
      font-size: 14px;
      line-height: 1.45;
    }
    .dots {
      display: flex;
      gap: 7px;
      margin: 12px 0 14px;
    }
    .dot {
      width: 18px;
      height: 18px;
      border-radius: 5px;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.45), 0 2px 8px rgba(24,34,48,0.12);
    }
    .foot {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      padding-top: 10px;
      border-top: 1px solid rgba(24, 34, 48, 0.08);
      color: #667085;
      font-size: 12px;
    }
    button {
      border: 0;
      border-radius: 999px;
      background: #182230;
      color: white;
      font-size: 12px;
      font-weight: 700;
      padding: 7px 12px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main class="status-card">
    <section class="top">
      <p class="eyebrow">TME OA Monitor</p>
      <h1>abt状态检查</h1>
    </section>
    <section class="content">
      <div><p>昨日abt状态：success</p>
<p>完整abt状态：success, success, success, success, success, success, success</p>
<p>&nbsp;</p>
<p>今天的检查已停止。</p></div>
      <div class="dots"><span class="dot" title="success" style="background: rgb(103, 194, 58)"></span><span class="dot" title="success" style="background: rgb(103, 194, 58)"></span><span class="dot" title="success" style="background: rgb(103, 194, 58)"></span><span class="dot" title="success" style="background: rgb(103, 194, 58)"></span><span class="dot" title="success" style="background: rgb(103, 194, 58)"></span><span class="dot" title="success" style="background: rgb(103, 194, 58)"></span><span class="dot" title="success" style="background: rgb(103, 194, 58)"></span></div>
      <div class="foot">
        <span>30s 后自动关闭</span>
        <button onclick="window.close()">关闭</button>
      </div>
    </section>
  </main>
  <script>
    setTimeout(() => window.close(), 30000);
  </script>
</body>
</html>
